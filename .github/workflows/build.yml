name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Install package with dev extras
        run: pip install "$(ls dist/*.whl)[dev]"

      - name: Run tests
        run: pytest -q

      # Run from outside the checkout so the source tree is not importable —
      # this exercises the installed wheel, including its bundled templates.
      - name: Verify the installed wheel generates a report
        working-directory: /tmp
        run: sbomly diff "$GITHUB_WORKSPACE/tests/fixtures/cdx-old.json" "$GITHUB_WORKSPACE/tests/fixtures/cdx-new.json" --html report.html --markdown pr.md

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

  docker:
    # The base images on dhi.io need a login, and pull requests from forks don't get
    # secrets, so those skip the image build.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sbomly:ci
      - name: Smoke test
        run: |
          docker run --rm sbomly:ci --version
          # Exit 1 is expected: the fixtures contain an upgrade. Anything else fails.
          code=0
          docker run --rm -v "$PWD/tests/fixtures:/data:ro" sbomly:ci diff cdx-old.json cdx-new.json --fail-on upgraded || code=$?
          [ "$code" -eq 1 ]
